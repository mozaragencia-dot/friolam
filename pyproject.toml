[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friolam"
version = "0.1.0"
description = "Friolam project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Friolam Team" }
]

[project.scripts]
friolam = "friolam.main:main"
friolam-web = "friolam.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
